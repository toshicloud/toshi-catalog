name: check

on:
  pull_request:
    paths:
      - "index.json"
      - "index.json.sig"
      - "catalog.toml"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/check.yml"
  push:
    branches:
      - main
    paths:
      - "index.json"
      - "index.json.sig"
      - "catalog.toml"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/check.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check the index
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--valid-for 168h)
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_REF}" ] && git cat-file -e "origin/${BASE_REF}:index.json"; then
            git show "origin/${BASE_REF}:index.json" > base.json
            args+=(--base base.json)
          fi
          go run ./cmd/check "${args[@]}"
