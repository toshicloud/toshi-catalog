name: check

on:
  pull_request:
    paths:
      - "index.json"
      - "index.json.sig"
      - "generations/**"
      - "entries/**"
      - ".gitattributes"
      - "catalog.toml"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/check.yml"
  push:
    branches:
      - main
    paths:
      - "index.json"
      - "index.json.sig"
      - "generations/**"
      - "entries/**"
      - ".gitattributes"
      - "catalog.toml"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/check.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse a changed generation
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ]; then
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- generations/)
          if [ -n "${changed}" ]; then
            printf '%s\n' "${changed}" >&2
            echo "::error::a signed generation is never changed: sign a higher sequence"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check the index
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--valid-for 168h)
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_REF}" ] && git cat-file -e "origin/${BASE_REF}:index.json"; then
            git show "origin/${BASE_REF}:index.json" > base.json
            args+=(--base base.json)
          fi
          go run ./cmd/check "${args[@]}"

  served:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the checker
        run: go build -o "${RUNNER_TEMP}/check" ./cmd/check

      - name: Check the served index
        id: served
        run: |
          set -u
          set +e
          "${RUNNER_TEMP}/check" --served --valid-for 168h 2> "${RUNNER_TEMP}/served.err"
          status=$?
          set -e
          cat "${RUNNER_TEMP}/served.err" >&2
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          reason=$(head -n 1 "${RUNNER_TEMP}/served.err" | tr -d '\r')
          case "${status}" in
            3)
              kind=unreachable
              title="The served index was unreachable"
              ;;
            *)
              if grep -q 'expire' "${RUNNER_TEMP}/served.err"; then
                kind=expired
                title="The served index did not meet --valid-for"
              else
                kind=invalid
                title="The served index was invalid"
              fi
              ;;
          esac
          {
            echo "kind=${kind}"
            echo "reason=${reason:-no output}"
          } >> "${GITHUB_OUTPUT}"
          annotation=$(printf '%s' "${reason:-no output}" | sed 's/%/%25/g')
          echo "::error title=${title}::${annotation}"
          exit 1

      - name: Open or update the issue for a failing check
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KIND: ${{ steps.served.outputs.kind }}
          REASON: ${{ steps.served.outputs.reason }}
        run: |
          set -euo pipefail
          reason="${REASON:-no output}"
          case "${KIND}" in
            unreachable) what="the served index was unreachable (exit 3): ${reason}" ;;
            expired) what="the served index did not meet --valid-for 168h (expired or too near expiry): ${reason}" ;;
            invalid) what="the served index was invalid: ${reason}" ;;
            *) what="the served check failed before it could classify the index: ${reason}" ;;
          esac
          body=$(printf 'catalog check failed: %s\nrun: %s' "${what}" "${RUN_URL}")
          number=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --search 'in:title "catalog check failed"' \
            --json number,title \
            --jq '.[] | select(.title == "catalog check failed") | .number' \
            | head -n 1)
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "catalog check failed" --label bug --body "${body}"
          fi
