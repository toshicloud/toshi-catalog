{{/* Shared layout and copy controls for the catalog pages. */}}
{{define "head"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Toshi catalog</title>
  <link rel="stylesheet" href="{{.Root}}style.css">
</head>
<body>
<header class="site-header">
  <nav aria-label="Main navigation">
    <a href="{{.Root}}index.html">Toshi catalog</a>
    <a href="{{.Root}}hosted.html">Hosted</a>
  </nav>
</header>
<main>
{{end}}
{{define "foot"}}</main>
<script type="text/javascript">
document.addEventListener("click", async function (event) {
  const button = event.target.closest("[data-copy-target]");
  if (!button) return;
  const target = document.getElementById(button.dataset.copyTarget);
  if (!target) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(target.textContent);
      button.textContent = "Copied";
      return;
    } catch (_) {
      // Select the text when the clipboard is unavailable or permission is denied.
    }
  }
  const selection = window.getSelection();
  if (selection) {
    const range = document.createRange();
    range.selectNodeContents(target);
    selection.removeAllRanges();
    selection.addRange(range);
    button.textContent = "Selected — press Ctrl/Cmd+C";
  }
});
</script>
</body>
</html>
{{end}}
